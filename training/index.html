    function formatDateTime(iso){
      if(!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }

    function shuffle(arr){
      for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ─── Autenticação ───────────────────────────────────────────────────────────
    async function submitLoginT(){
      const email = document.getElementById('t-email').value.trim();
      const password = document.getElementById('t-password').value;
      const errEl = document.getElementById('t-login-error');
      errEl.textContent = '';
      if(!email || !password){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
      const btn = document.getElementById('t-login-btn');
      btn.textContent = 'Entrando…'; btn.disabled = true;
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if(error){
        errEl.textContent = 'E-mail ou senha incorretos.';
        btn.textContent = 'Entrar'; btn.disabled = false;
        return;
      }
      await handleSessionT(data.session);
      btn.textContent = 'Entrar'; btn.disabled = false;
    }

    async function checkSessionT(){
      const { data: { session } } = await _supabase.auth.getSession();
      if(session) await handleSessionT(session);
    }

    async function handleSessionT(session){
      const errEl = document.getElementById('t-login-error');
      const { data: userRow } = await _supabase.from('users').select('role,name').eq('id', session.user.id).single();
      if(!userRow || userRow.role !== 'provider'){
        errEl.textContent = 'Esta área é exclusiva para prestadores cadastrados.';
        await _supabase.auth.signOut();
        return;
      }
      const { data: provRow } = await _supabase.from('providers').select('id,specialties,status').eq('user_id', session.user.id).single();
      if(!provRow){
        errEl.textContent = 'Cadastro de prestador não encontrado para esta conta.';
        await _supabase.auth.signOut();
        return;
      }
      _currentProvider = {
        id: provRow.id,
        userId: session.user.id,
        name: userRow.name,
        specialties: provRow.specialties || [],
        requiredModules: requiredModulesFor(provRow.specialties)
      };
      await loadDashboardT();
    }

    async function doLogoutT(){
      await _supabase.auth.signOut();
      _currentProvider = null; _progressMap = {}; _certification = null; _quizState = null;
      document.getElementById('t-email').value = '';
      document.getElementById('t-password').value = '';
      document.getElementById('t-login-error').textContent = '';
      goScreenT('t-login');
    }

    // ─── Dashboard ──────────────────────────────────────────────────────────────
    async function loadDashboardT(){
      const { data: progressRows } = await _supabase
        .from('training_progress')
        .select('*')
        .eq('provider_id', _currentProvider.id);
      _progressMap = {};
      (progressRows || []).forEach(r => { _progressMap[r.module_id] = r; });

      const { data: certRow } = await _supabase
        .from('training_certifications')
        .select('*')
        .eq('provider_id', _currentProvider.id)
        .maybeSingle();
      _certification = certRow || null;

      // rede de segurança: se por algum motivo todos os módulos já estão 'passed'
      // mas o certificado não foi emitido (ex: sessão anterior interrompida), emite agora.
      if(!_certification) await checkAndIssueCertificateT();

      renderDashboardT();
      goScreenT('t-dashboard');
    }

    function getModuleStatusT(moduleId){
      const row = _progressMap[moduleId];
      if(!row) return { state: 'not_started' };
      if(row.status === 'passed') return { state: 'passed', score: row.score };
      if(row.status === 'blocked'){
        const until = row.blocked_until ? new Date(row.blocked_until) : null;
        if(until && until > new Date()) return { state: 'blocked', until, score: row.score, attempts: row.attempts };
        return { state: 'retry', score: row.score, attempts: row.attempts };
      }
      return { state: 'not_started' };
    }

    function renderCertBannerT(){
      const el = document.getElementById('t-cert-banner');
      if(_certification){
        el.innerHTML = `<div class="card" style="background:var(--green-light);border-color:var(--green)">
          <div class="row" style="margin-bottom:0">
            <div>
              <div style="font-weight:500">🎓 Certificado AutoCare</div>
              <div style="font-size:11px;color:var(--muted)">Emitido em ${formatDateTime(_certification.issued_at)}</div>
            </div>
            <span class="badge badge-green">${_certification.cert_id}</span>
          </div>
        </div>`;
      } else {
        el.innerHTML = `<div class="info-box info-blue">Complete os ${_currentProvider.requiredModules.length} módulos abaixo (mínimo 60% cada) para receber sua certificação AutoCare.</div>`;
      }
    }

    function renderDashboardT(){
      renderCertBannerT();
      const list = document.getElementById('t-module-list');
      list.innerHTML = '';
      _currentProvider.requiredModules.forEach(id => {
        const info = QUESTION_BANK[id];
        const st = getModuleStatusT(id);
        const card = document.createElement('div');
        card.className = 'card';
        let badge = '', extra = '';
        if(st.state === 'passed'){
          badge = `<span class="badge badge-green">Aprovado · ${st.score}%</span>`;
        } else if(st.state === 'blocked'){
          badge = `<span class="badge badge-red">Bloqueado</span>`;
          extra = `<div class="info-box info-red" style="margin-top:8px;margin-bottom:0">Novo teste liberado em ${formatDateTime(st.until)}</div>`;
        } else if(st.state === 'retry'){
          badge = `<span class="badge badge-orange">Não aprovado · ${st.score}%</span>`;
          extra = `<button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="openModuleIntroT('${id}')">Tentar novamente</button>`;
        } else {
          badge = `<span class="badge badge-gray">Não iniciado</span>`;
          extra = `<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="openModuleIntroT('${id}')">Iniciar módulo</button>`;
        }
        card.innerHTML = `
          <div class="row" style="margin-bottom:2px;align-items:flex-start">
            <div>
              <div class="module-card-title">Módulo ${id} — ${info.nome}</div>
              <div class="module-card-sub">${info.total_questoes} perguntas no banco · ${QUESTIONS_PER_ATTEMPT} sorteadas por tentativa</div>
            </div>
            ${badge}
          </div>
          ${extra}
        `;
        list.appendChild(card);
      });
    }

    function goDashboardT(){
      renderDashboardT();
      goScreenT('t-dashboard');
    }

    // Visão geral + objetivos + quadro de regra geral (training/data/module_overviews.json),
    // renderizados no topo da tela do módulo, antes do vídeo/placeholder. Vale para os 7 módulos.
    function renderModuleOverviewT(moduleId){
      const el = document.getElementById('t-module-overview');
      const ov = MODULE_OVERVIEWS[moduleId];
      if(!ov){ el.innerHTML = ''; return; }

      const objetivosHtml = (ov.objetivos || []).map(o => `<li>${o}</li>`).join('');

      el.innerHTML = `
        <div class="card">
          <div style="font-size:13px;line-height:1.55">${ov.visao_geral}</div>
        </div>
        <div class="card">
          <div style="font-weight:500;font-size:13px;margin-bottom:8px">Ao concluir este módulo você saberá:</div>
          <ul class="module-objectives">${objetivosHtml}</ul>
        </div>
        <div class="info-box info-yellow module-rule-box">
          <span class="mrb-emoji">${ov.regra_geral.emoji}</span>
          <div>
            <div class="mrb-titulo">${ov.regra_geral.titulo}</div>
            <div>${ov.regra_geral.texto}</div>
          </div>
        </div>
      `;
    }

    // ─── Tela do módulo (vídeo) ─────────────────────────────────────────────────
    // Fica entre o dashboard e o quiz. Se o módulo tem vídeo (MODULE_VIDEOS[id]),
    // o botão de iniciar o quiz começa oculto e só aparece quando o vídeo dispara
    // 'ended'. Sem vídeo cadastrado -> placeholder "em produção" e botão já visível
    // (não dá pra bloquear em cima de um vídeo que não existe).
    function openModuleIntroT(moduleId){
      const st = getModuleStatusT(moduleId);
      if(st.state === 'blocked'){
        alert('Este módulo está bloqueado até ' + formatDateTime(st.until) + '.');
        return;
      }
      _introModuleId = moduleId;
      const info = QUESTION_BANK[moduleId];
      document.getElementById('t-module-intro-title').textContent = `Módulo ${moduleId} — ${info.nome}`;

      renderModuleOverviewT(moduleId);

      const wrap = document.getElementById('t-module-video-wrap');
      const btn  = document.getElementById('t-module-start-quiz-btn');
      const videoSrc = MODULE_VIDEOS[moduleId];

      if(videoSrc){
        btn.hidden = true;
        wrap.innerHTML = `
          <video id="t-module-video" style="width:100%;border-radius:10px;background:#000;display:block"
            controls controlsList="nodownload" playsinline preload="metadata">
            <source src="${videoSrc}" type="video/mp4">
            Seu navegador não suporta reprodução de vídeo.
          </video>
          <div class="info-box info-blue" style="margin-top:10px">Assista o vídeo até o fim para liberar o quiz. Você pode voltar e rever trechos já assistidos, mas não pode avançar sem assistir.</div>
        `;
        setupVideoGuardT(document.getElementById('t-module-video'));
      } else {
        btn.hidden = false;
        wrap.innerHTML = `
          <div class="card" style="text-align:center;padding:32px 16px">
            <div style="font-size:40px;margin-bottom:10px">🎬</div>
            <div style="font-weight:500;margin-bottom:4px">Vídeo em produção</div>
            <div style="font-size:12px;color:var(--muted)">O vídeo deste módulo ainda não está disponível. Você já pode seguir direto para o quiz.</div>
          </div>
        `;
      }

      goScreenT('t-module-intro');
    }

    // Impede pular pra frente: guarda o ponto mais adiantado já assistido
    // (avança só via reprodução normal) e, se o usuário arrastar a barra pra
    // frente disso, volta o currentTime pro ponto máximo já visto. Rebobinar
    // e rever qualquer trecho já assistido continua liberado.
    function setupVideoGuardT(videoEl){
      let maxWatched = 0;
      const TOLERANCE = 0.75; // segundos, evita brigar com a granularidade do timeupdate
      videoEl.addEventListener('timeupdate', () => {
        if(videoEl.currentTime > maxWatched) maxWatched = videoEl.currentTime;
      });
      videoEl.addEventListener('seeking', () => {
        if(videoEl.currentTime > maxWatched + TOLERANCE){
          videoEl.currentTime = maxWatched;
        }
      });
      videoEl.addEventListener('ended', () => {
        maxWatched = videoEl.duration || maxWatched;
        document.getElementById('t-module-start-quiz-btn').hidden = false;
      });
    }

    function startQuizFromIntroT(){
      if(!_introModuleId) return;
      startQuizT(_introModuleId);
    }

    // ─── Quiz ───────────────────────────────────────────────────────────────────
    function startQuizT(moduleId){
      const st = getModuleStatusT(moduleId);
      if(st.state === 'blocked'){
        alert('Este módulo está bloqueado até ' + formatDateTime(st.until) + '.');
        return;
      }
      const bank = QUESTION_BANK[moduleId].banco_questoes;
      const selected = shuffle(bank.slice()).slice(0, QUESTIONS_PER_ATTEMPT);
      _quizState = { moduleId, questions: selected, index: 0, correctCount: 0, selected: null };
      document.getElementById('t-quiz-title').textContent = `Módulo ${moduleId} — ${QUESTION_BANK[moduleId].nome}`;
      renderQuestionT();
      goScreenT('t-quiz');
    }

    function renderQuestionT(){
      const q = _quizState.questions[_quizState.index];
      const total = _quizState.questions.length;
      document.getElementById('t-quiz-progress').textContent = `Pergunta ${_quizState.index + 1} de ${total}`;
      document.getElementById('t-quiz-progress-fill').style.width = Math.round((_quizState.index / total) * 100) + '%';

      const container = document.getElementById('t-quiz-question');
      container.innerHTML = `
        <div class="card">
          <div style="font-size:11px;color:var(--blue);font-weight:500;margin-bottom:6px">${q.tema}</div>
          <div style="font-size:14px;margin-bottom:14px;line-height:1.5">${q.pergunta}</div>
          <div id="t-quiz-options"></div>
        </div>
      `;
      const optsEl = document.getElementById('t-quiz-options');
      ['A','B','C','D'].forEach(letter => {
        if(!q.alternativas[letter]) return;
        const optEl = document.createElement('div');
        optEl.className = 'quiz-option';
        optEl.dataset.letter = letter;
        optEl.innerHTML = `<span class="quiz-option-letter">${letter}</span><span>${q.alternativas[letter]}</span>`;
        optEl.onclick = () => selectAnswerT(letter);
        optsEl.appendChild(optEl);
      });
      _quizState.selected = null;
      updateNextButtonT();
    }

    function selectAnswerT(letter){
      _quizState.selected = letter;
      document.querySelectorAll('.quiz-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.letter === letter);
      });
      updateNextButtonT();
    }

    function updateNextButtonT(){
      const btn = document.getElementById('t-quiz-next');
      btn.disabled = !_quizState.selected;
      btn.textContent = (_quizState.index === _quizState.questions.length - 1) ? 'Finalizar' : 'Próxima';
    }

    async function quizNext(){
      if(!_quizState.selected) return;
      const q = _quizState.questions[_quizState.index];
      if(_quizState.selected === q.correta) _quizState.correctCount++;
      _quizState.index++;
      if(_quizState.index < _quizState.questions.length){
        renderQuestionT();
      } else {
        await finishQuizT();
      }
    }

    function confirmExitQuiz(){
      if(confirm('Sair do quiz? Suas respostas desta tentativa serão perdidas.')){
        _quizState = null;
        goDashboardT();
      }
    }

    // ─── Salvar progresso + emitir certificado ────────────────────────────────
    async function finishQuizT(){
      const total = _quizState.questions.length;
      const correct = _quizState.correctCount;
      const scorePct = Math.round((correct / total) * 100);
      const passed = scorePct >= PASS_SCORE;
      const moduleId = _quizState.moduleId;

      const nextBtn = document.getElementById('t-quiz-next');
      nextBtn.disabled = true;
      nextBtn.textContent = 'Salvando…';

      const existing = _progressMap[moduleId];
      const attempts = (existing?.attempts || 0) + 1;
      const nowIso = new Date().toISOString();

      const payload = {
        provider_id: _currentProvider.id,
        module_id: moduleId,
        status: passed ? 'passed' : 'blocked',
        score: scorePct,
        attempts: attempts,
        blocked_until: passed ? null : new Date(Date.now() + BLOCK_HOURS * 3600 * 1000).toISOString(),
        completed_at: passed ? nowIso : (existing?.completed_at || null),
        updated_at: nowIso
      };

      const { data: savedRow, error } = await _supabase
        .from('training_progress')
        .upsert(payload, { onConflict: 'provider_id,module_id' })
        .select()
        .single();

      if(error){
        alert('Erro ao salvar o progresso: ' + error.message);
        goDashboardT();
        return;
      }
      _progressMap[moduleId] = savedRow;

      let certJustIssued = false;
      if(passed) certJustIssued = await checkAndIssueCertificateT();

      renderResultT({ correct, total, scorePct, passed, moduleId, certJustIssued });
      goScreenT('t-result');
    }

    async function checkAndIssueCertificateT(){
      if(_certification) return false; // já certificado
      const allPassed = _currentProvider.requiredModules.every(id => _progressMap[id]?.status === 'passed');
      if(!allPassed) return false;

      const certId = 'AC-' + _currentProvider.id.slice(0, 8).toUpperCase() + '-' + Date.now();
      const modulesJson = _currentProvider.requiredModules.map(id => ({
        module_id: id,
        nome: QUESTION_BANK[id].nome,
        score: _progressMap[id].score,
        completed_at: _progressMap[id].completed_at
      }));

      const { data: certRow, error: certErr } = await _supabase
        .from('training_certifications')
        .insert({ provider_id: _currentProvider.id, cert_id: certId, modules_json: modulesJson })
        .select()
        .single();

      if(certErr){
        console.error('Erro ao emitir certificado:', certErr);
        return false;
      }
      _certification = certRow;

      const { error: updErr } = await _supabase
        .from('providers')
        .update({
          training_certified: true,
          training_certified_at: certRow.issued_at,
          training_cert_id: certId
        })
        .eq('id', _currentProvider.id);

      if(updErr) console.error('Erro ao atualizar providers.training_certified:', updErr);

      return true;
    }

    function renderResultT({ correct, total, scorePct, passed, moduleId, certJustIssued }){
      const el = document.getElementById('t-result-content');
      let html = '';
      if(passed){
        html += `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:52px;margin-bottom:12px">✅</div>
            <div style="font-size:18px;font-weight:500;margin-bottom:4px">Módulo concluído!</div>
            <div style="font-size:13px;color:var(--muted)">Você acertou ${correct} de ${total} (${scorePct}%)</div>
          </div>`;
      } else {
        const until = _progressMap[moduleId].blocked_until;
        html += `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:52px;margin-bottom:12px">❌</div>
            <div style="font-size:18px;font-weight:500;margin-bottom:4px">Não foi dessa vez</div>
            <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Você acertou ${correct} de ${total} (${scorePct}%). É necessário pelo menos ${PASS_SCORE}% para passar.</div>
            <div class="info-box info-red">Novo teste liberado em ${formatDateTime(until)}</div>
          </div>`;
      }
      if(certJustIssued){
        html += `
          <div class="card" style="background:var(--green-light);border-color:var(--green);text-align:center;margin-top:4px">
            <div style="font-size:32px;margin-bottom:8px">🎓</div>
            <div style="font-weight:500;margin-bottom:4px">Certificação AutoCare emitida!</div>
            <div style="font-size:12px;color:var(--muted)">Código: ${_certification.cert_id}</div>
          </div>`;
      }
      el.innerHTML = html;
    }

    // ─── Init ───────────────────────────────────────────────────────────────────
    checkSessionT();
  </script>
</body>
</html>
